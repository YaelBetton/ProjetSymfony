# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    # Version ajoutée aux URL générées par asset() (ex. css/base.css?v=1.1) :
    # l'incrémenter après une modification du CSS / JS force les navigateurs à recharger les fichiers.
    assets:
        version: '1.2'
        version_format: '%%s?v=%%s'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
